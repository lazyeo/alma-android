name: Feature request
description: Suggest an improvement for Alma Android
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the smallest useful outcome. Do not include pairing links, tokens, or private desktop content.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What behavior would solve the problem?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds or smaller options if relevant.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized mockups or examples. Remove private content and credentials.
  - type: checkboxes
    id: existing
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues and did not find this request.
          required: true
